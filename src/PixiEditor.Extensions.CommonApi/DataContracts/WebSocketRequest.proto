syntax = "proto3";
package PixiEditor.Network;

option csharp_namespace = "PixiEditor.Extensions.CommonApi.Network";

message WebSocketRequest
{
  WebSocketOperation Operation = 1;

  string Url = 2;
  map<string, string> Headers = 3;

  WebSocketMessage Message = 4;
}

enum WebSocketOperation
{
  CONNECT = 0;
  SEND = 1;
  RECEIVE = 2;
  CLOSE = 3;
}

enum WebSocketMessageType
{
  TEXT = 0;
  BINARY = 1;
}

message WebSocketMessage
{
  WebSocketMessageType MessageType = 1;
  bytes Body = 2;
}